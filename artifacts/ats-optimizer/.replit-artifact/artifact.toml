kind = "web"
previewPath = "/"
title = "ATS CV Optimizer"
version = "1.0.0"
id = "artifacts/ats-optimizer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18652

[services.development]
run = "pnpm --filter @workspace/ats-optimizer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ats-optimizer", "run", "build" ]
publicDir = "artifacts/ats-optimizer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18652"
BASE_PATH = "/"
